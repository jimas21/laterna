[package]
name = "frameplayerx"
# Version is calculated by git-cliff in CI and stamped before building.
# Local builds use this placeholder; it is never shipped.
version = "0.0.0-dev"
description = "Native VR video player for the Valve Steam Frame"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ash.workspace = true
# Subtitle text: shaping, right-to-left lines and font fallback for every
# script, which egui's text lacks.
cosmic-text = "0.19"
crossbeam-channel.workspace = true
egui.workspace = true
fp-core.workspace = true
fp-earbuds.workspace = true
fp-haptics.workspace = true
fp-library.workspace = true
fp-media.workspace = true
fp-remote.workspace = true
fp-render.workspace = true
fp-sources.workspace = true
fp-updater.workspace = true
fp-xr.workspace = true
glam.workspace = true
# Interface translations: Fluent messages built in (i18n/), their ids and
# arguments checked against the English ones at build time.
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc.workspace = true
log.workspace = true
# Source PIN protection PBKDF2 hashing.
ring = "0.17"
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Checks the translations against the English messages.
fluent-syntax = "0.12"
