# Place packs bundled into the release, one per line:  <id> <url> <sha256>
#
# tools/fetch-places.sh downloads each url, checks the sha256 of the zip and
# unpacks it into <outdir>/<id>/. CI then bundles them (tools/package.sh) into
# places/ in the install archive. A line whose download or checksum fails stops
# the build. Packs are made with tools/pack-encode.py and published as release
# assets of the public jimas21/laterna-places repository; the url names one
# release asset, the sha256 is printed by pack-encode.py --zip.

